name: 更新 resource_list.json & Wiki

on:
  push:
    branches:
      - "main"
    paths:
      - "meme_generator/memes/**"
      - "meme_generator/memes_jj/**"
      - "meme_generator/memes_emoji/**"
      - "meme_generator/memes_other/**"
      - "meme_generator/memes_emoji_nsfw/**"
      - "meme_generator/memes_tudou/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_wiki:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 检出 Wiki 仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          fetch-depth: 0
          # 关键：不持久化 GITHUB_TOKEN 凭证。checkout 默认会在 .git/config 写入
          # GITHUB_TOKEN 的 Authorization extraheader，推送时它会覆盖显式 remote URL
          # 里的 WIKI_TOKEN，导致 403（denied to github-actions[bot]）
          persist-credentials: false

      - name: 设置 Python 环境（pyproject 要求 ^3.12）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Poetry
        uses: Gr1N/setup-poetry@v9

      - name: 安装依赖
        run: poetry install

      - name: 安装字体
        run: |
          sudo apt update -y
          sudo apt install -y fonts-noto-color-emoji libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libegl1-mesa-dev
          sudo mkdir -p /usr/share/fonts/myfonts
          sudo cp resources/fonts/* /usr/share/fonts/myfonts/
          fc-cache -fv
      - name: 更新表情列表
        run: poetry run python wiki/update_meme_list.py

      - name: 提交并推送 Wiki 更新
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          cd "${{ github.workspace }}/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过推送"
            exit 0
          fi
          git commit -m "更新 Meme 列表"
          # 双保险：清掉 checkout 可能残留的 GITHUB_TOKEN extraheader，确保用 WIKI_TOKEN 认证
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          # 显式 remote URL 推送（与 init-wiki 相同机制，避免 actions-js/push 的认证问题）
          remote="https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git push "$remote" HEAD:master
          echo "✅ Wiki 更新完成"
