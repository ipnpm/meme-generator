name: 初始化 Wiki（一次性）

# 把上游 Memes02 的 Wiki 内容（文档+脚本+预览图）搬到你的 wiki 仓库，
# 并把文档里的链接替换为你的仓库地址。跑一次即可，之后可以删除本文件。
#
# 前提（缺一不可）：
#   1. 先在网页上启用你的 Wiki：
#      打开 https://github.com/ipnpm/meme-generator/wiki
#      点 "Create the first page" → 随便写一行字 → Save
#   2. 创建 PAT 存为仓库 secret，名字 WIKI_TOKEN：
#      Settings → Secrets and variables → Actions → New repository secret
#      PAT 权限要求：
#        - Classic token：勾选 repo（整体）
#        - Fine-grained token：Resource owner 选你自己（ipnpm），
#          Repository access 勾选 meme-generator，Permissions → Contents: Read and write

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: 诊断 WIKI_TOKEN
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "❌ WIKI_TOKEN secret 未配置（名字必须精确是 WIKI_TOKEN）"
            exit 1
          fi
          echo "WIKI_TOKEN 已配置（长度 ${#WIKI_TOKEN}）"
          # 1) 验证 token 身份（无 scope 也能通过，只能证明 token 本身有效）
          who=$(curl -s -H "Authorization: Bearer $WIKI_TOKEN" https://api.github.com/user | grep '"login"' | head -1)
          echo "Token 身份: $who"
          if [ -z "$who" ]; then
            echo "❌ token 无效（过期/复制不完整）。请重新创建并更新 secret"
            exit 1
          fi
          # 2) 检查 scopes 响应头 —— classic token 勾了什么权限直接可见
          scopes=$(curl -sI -H "Authorization: Bearer $WIKI_TOKEN" https://api.github.com/user | grep -i '^x-oauth-scopes' | tr -d '\r')
          echo "Token scopes: ${scopes:-（无任何权限）}"
          case "$scopes" in
            *repo*)
              echo "✅ token 含 repo 权限" ;;
            *)
              echo "❌ token 缺少 repo 权限 —— 请重新创建 token 并勾选 repo（大项整体勾上），再更新 secret"
              exit 1 ;;
          esac
          # 3) 用 git ls-remote 验证对 wiki 的读访问（wiki 不在 REST API 里，只能走 git 协议）
          if git ls-remote "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" >/dev/null 2>&1; then
            echo "✅ token 可以访问 wiki 仓库"
          else
            echo "❌ token 无法读取 wiki —— 账号可能不是仓库 owner，请确认用 ipnpm 账号创建 token"
            exit 1
          fi

      - name: 克隆你的 Wiki 仓库（PAT 认证）
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: 克隆上游 Wiki（完整历史一并迁移）
        run: git clone https://github.com/Memes02/meme-generator.wiki.git upstream

      - name: 拷贝内容并替换链接
        run: |
          cd wiki
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r ../upstream/. .
          python3 - << 'EOF'
          from pathlib import Path
          old = "Memes02/meme-generator"
          new = "${{ github.repository }}"
          for f in Path('.').glob('*.md'):
              text = f.read_text(encoding='utf-8')
              if old in text:
                  f.write_text(text.replace(old, new), encoding='utf-8')
                  print('替换:', f.name)
          EOF

      - name: 提交并推送（显式 remote，与上游 update.yaml 的机制一致）
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化（可能已初始化过）"
            exit 0
          fi
          git commit -m "初始化 Wiki：从上游 Memes02 迁移文档与表情预览"
          # 显式 remote URL 推送，不依赖 origin（与 actions-js/push 相同机制）
          remote="https://${GITHUB_ACTOR}:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git push "$remote" HEAD:master
          echo "✅ Wiki 初始化完成"
