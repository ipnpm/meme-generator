name: 同步表情仓库

# 每 6 小时从上游表情仓库拉取最新表情，提交到本仓库 main 分支
# （fork 自 Memes02/meme-generator，上游结构与此相同）
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          # 用 GITHUB_TOKEN 推送后，push 事件不会再触发其他 workflow（防止死循环）
          persist-credentials: true

      - name: 检出memes仓库代码（原版主库）
        uses: actions/checkout@v4
        with:
          ref: main
          repository: MemeCrafters/meme-generator
          path: ${{ github.workspace }}/meme

      - name: 检出memes_jj仓库代码
        uses: actions/checkout@v4
        with:
          ref: master
          repository: jinjiao007/meme-generator-jj
          path: ${{ github.workspace }}/memes_jj

      - name: 检出memes_emoji仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          repository: anyliew/meme_emoji
          path: ${{ github.workspace }}/memes_emoji

      - name: 检出memes_emoji_nsfw仓库代码
        uses: actions/checkout@v4
        with:
          ref: main
          repository: anyliew/meme_emoji_nsfw
          path: ${{ github.workspace }}/memes_emoji_nsfw

      - name: 清理数据并同步
        shell: bash {0}
        run: |
          set -e
          shopt -s extglob
          # 保留各目录 README.md，其余清空后从上游复制
          rm -rf meme_generator/memes/*
          rm -rf meme_generator/memes_jj/!(README.md)
          rm -rf meme_generator/memes_emoji/!(README.md)
          rm -rf meme_generator/memes_emoji_nsfw/!(README.md)
          cp -r ${{ github.workspace }}/meme/meme_generator/memes/* meme_generator/memes/
          cp -r ${{ github.workspace }}/memes_jj/memes/* meme_generator/memes_jj/
          cp -r ${{ github.workspace }}/memes_emoji/emoji/* meme_generator/memes_emoji/
          cp -r ${{ github.workspace }}/memes_emoji_nsfw/emoji/* meme_generator/memes_emoji_nsfw/
          rm -rf ${{ github.workspace }}/meme ${{ github.workspace }}/memes_jj ${{ github.workspace }}/memes_emoji ${{ github.workspace }}/memes_emoji_nsfw
          # 清理同步过程中可能带进来的缓存目录
          find meme_generator -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: 检查是否有变化
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "变更统计:" && git diff --cached --stat | tail -3
          fi

      - name: 提交并推送更改
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "同步表情更新"
          git push
          echo "✅ 已提交表情更新"

      # GITHUB_TOKEN 产生的 push 不会触发其他 workflow（GitHub 防递归规则），
      # 所以这里用 PAT 显式触发下游的两个 workflow（与上游 Memes02 的机制一致）
      - name: 触发「同步表情到 HuggingFace Space」
        if: steps.changes.outputs.changed == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: sync-to-hf.yaml
          token: ${{ secrets.WIKI_TOKEN }}

      - name: 触发「更新 resource_list.json & Wiki」
        if: steps.changes.outputs.changed == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: update.yaml
          token: ${{ secrets.WIKI_TOKEN }}
